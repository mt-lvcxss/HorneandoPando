<!doctype html>
<html lang="es">
  <body style="font-family: Arial, sans-serif; color: #1f2933; line-height: 1.5;">
    <h2>Confirma tu cuenta en Horneando Pando</h2>
    <p>Recibimos una solicitud para crear una cuenta con este correo.</p>
    <p>
      <a href="{{ .SiteURL }}/auth/confirmado?token_hash={{ .TokenHash }}&type=email"

  </body>
</html>
