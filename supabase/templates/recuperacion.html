<!doctype html>
<html lang="es">
  <body style="font-family: Arial, sans-serif; color: #1f2933; line-height: 1.5;">
    <h2>Restablece tu contraseña</h2>
    <p>Recibimos una solicitud para restablecer la contraseña de tu cuenta en Horneando Pando.</p>
    <p>
      <a href="{{ .SiteURL }}/auth/restablecer?token_hash={{ .TokenHash }}&type=recovery"
         style="background:#7a4b2a;color:#fff;padding:10px 18px;border-radius:6px;text-decoration:none;">
        Elegir una nueva contraseña
      </a>
    </p>
    <p>El enlace es de un solo uso y vence en 1 hora.</p>
    <p>Si no lo solicitaste, ignora este mensaje: tu contraseña actual sigue siendo válida.</p>
  </body>
</html>
